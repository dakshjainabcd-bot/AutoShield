<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoShield</title>
<style>
  body { font-family: system-ui, Segoe UI, Arial, sans-serif; margin: 0; color: #0F2A43; background: #f4f6f8; }
  main { max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }
  h1 { color: #0F2A43; margin-bottom: .2rem; }
  p.tag { color: #0E6B73; font-size: 1.2rem; margin-top: 0; }
  a.btn { display: inline-block; background: #0E6B73; color: #fff; padding: .7rem 1.2rem; border-radius: 6px; text-decoration: none; }
  .chip { display: inline-block; margin-left: 1rem; padding: .2rem .6rem; border-radius: 1rem; background: #ddd; font-size: .9rem; }
  .ok { background: #cfe9e6; } .bad { background: #f3d0cc; }
</style>
</head>
<body>
<main>
  <h1>AutoShield</h1>
  <p class="tag">Valid on the wire. Wrong in behaviour.</p>
  <p>Placeholder page from Phase 2. The real landing page is built in Phase 3.</p>
  <p><a class="btn" href="/dashboard/">Launch dashboard</a><span id="chip" class="chip">checking backend...</span></p>
</main>
<script>
fetch('/api/health').then(r => r.json()).then(j => {
  const c = document.getElementById('chip');
  c.textContent = 'backend online'; c.className = 'chip ok';
}).catch(() => {
  const c = document.getElementById('chip');
  c.textContent = 'backend offline: start the server'; c.className = 'chip bad';
});
</script>
</body>
</html>
