<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoShield dashboard (Phase 2 test page)</title>
<style>
  body { font-family: system-ui, Segoe UI, Arial, sans-serif; margin: 1rem; color: #0F2A43; background: #f4f6f8; }
  .badge { padding: .2rem .6rem; border-radius: 4px; background: #B7791F; color: #fff; font-weight: bold; }
  button { margin: .2rem; padding: .5rem .8rem; }
  pre { background: #fff; padding: .6rem; overflow: auto; max-height: 22rem; }
  #sev { font-size: 1.6rem; font-weight: bold; }
</style>
</head>
<body>
<h2>AutoShield dashboard <small>(Phase 2 test page: raw stream only, replaced in Phase 3)</small></h2>
<p><span id="badge" class="badge">-</span> connection: <b id="conn">connecting</b>
   &nbsp; severity: <span id="sev">-</span> &nbsp; <a href="/">Back to overview</a></p>
<div>
  <button onclick="inject({fault:'flood',duration_ms:5000})">Inject flood 5 s</button>
  <button onclick="inject({fault:'hang'})">Inject hang</button>
  <button onclick="inject({fault:'drift',slope:50})">Inject drift</button>
  <button onclick="inject({fault:'faulty_fw'})">Deploy faulty firmware</button>
  <button onclick="control({cmd:'test_burst',ms:2000})">Test burst 2 s</button>
  <button onclick="control({cmd:'reset_bench'})">Reset bench</button>
</div>
<h3>Latest telemetry</h3><pre id="tel">waiting...</pre>
<h3>Events (newest first)</h3><pre id="ev"></pre>
<script>
const $ = id => document.getElementById(id);
function post(url, body) {
  return fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
    .then(r => r.ok ? r.json() : r.text().then(t => alert(url + ': ' + t)));
}
const inject = b => post('/api/inject', b);
const control = b => post('/api/control', b);
let lines = [];
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { $('conn').textContent = 'online'; };
  ws.onclose = () => { $('conn').textContent = 'offline, retrying'; setTimeout(connect, 1000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'telemetry') {
      $('badge').textContent = m.mode === 'hw' ? 'HARDWARE' : 'SIMULATION';
      $('sev').textContent = m.severity;
      $('tel').textContent = JSON.stringify(m, null, 1);
    } else if (m.type === 'event') {
      lines.unshift((m.t_ms / 1000).toFixed(1) + ' s  ' + m.kind + '  ' + m.severity + '  ' + m.detail);
      lines = lines.slice(0, 60);
      $('ev').textContent = lines.join('\n');
    }
  };
}
connect();
</script>
</body>
</html>
